# Performance-preserving adaptive Q_safe pilot v2. The SAC actor first gets a
# full 5k-step target-policy learning window; masking then expands only within
# a tight local neighborhood and may not reduce conservative reward Q.
reward_profile: upstream
move_speed: 0.30

train:
  experiment_name: go2_50hz_030_adaptive_gated_v2
  control_frequency: 50.0
  max_steps: 15000
  start_training: 1000
  agent: safe_droq
  explore_action_scale: 0.5
  utd_ratio: 5
  save_dir: saved/experiments/go2_50hz_safe_adaptive_gated_v2
  checkpoint_interval: 5000
  metrics_interval: 10
  wandb_run_name: go2_50hz_safe_adaptive_gated_v2

  safe_droq:
    safety_mode: masking
    safety_update_period: 5
    safety_num_candidates: 32
    safety_epsilon: 0.20
    safety_activation_step: 5000
    safety_masking_ramp_steps: 2000
    safety_min_risk_improvement: 0.10
    safety_max_action_rms: 0.15
    safety_reward_q_margin: 0.0
