# Paper baseline: initialize from the independently trained 0.30 m/s SAC
# checkpoint, then fine-tune standard SAC at 0.40 m/s.
reward_profile: upstream
move_speed: 0.40

train:
  experiment_name: go2_sqrl_paper_030_to_040
  control_frequency: 50.0
  async_collection: true
  max_episode_steps: 500
  max_steps: 500000
  start_training: 0
  agent: droq
  utd_ratio: 1
  save_dir: saved/experiments/sqrl_paper/seed42/finetune_sac_async_v1
  checkpoint_interval: 25000
  metrics_interval: 10
  wandb_run_name: sac-paired-finetune-040-seed42

  droq:
    num_qs: 2
    num_min_qs: 2
    critic_dropout_rate: 0.0
    critic_layer_norm: false
