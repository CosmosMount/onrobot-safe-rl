# Initialize with --initialize-from <pretrain step directory>.
reward_profile: upstream
move_speed: 0.40

train:
  experiment_name: go2_sqrl_paper_030_to_040
  control_frequency: 50.0
  async_collection: true
  max_episode_steps: 500
  max_steps: 500000
  start_training: 0
  agent: paper_sqrl
  utd_ratio: 1
  save_dir: saved/experiments/sqrl_paper/seed42/finetune_sqrl_async_sac_v1
  checkpoint_interval: 25000
  metrics_interval: 10
  wandb_run_name: sqrl-paper-finetune-040-seed42

  paper_sqrl:
    num_qs: 2
    num_min_qs: 2
    critic_dropout_rate: 0.0
    critic_layer_norm: false
    sqrl_phase: finetune
    safety_gamma: 0.70
    safety_epsilon: 0.10
    safety_num_candidates: 100
    finetune_update_safety_critic: false
