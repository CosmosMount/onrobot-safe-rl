seed_derivation:
  algorithm: high_bit_then_domain_low15_then_14_8_18_2_6_bitpack_v1
  packed_field_order: [high_bit, domain_prefix, source_seed, role_tag, identity, namespace, index]
  packed_field_width_bits: [1, 15, 14, 8, 18, 2, 6]
  production_caps_exclusive: {source_seed: 16384, role_tag: 256, identity: 262144, namespace: 4, index: 64}
  high_bit: 1
  role_tags: {source_reset: 110, source_impulse: 111, source_action: 112, admission: 120, label: 130}
  source_streams_use: role_admission_domain
  label_streams_use: role_label_domain
  stream_mapping:
    source_reset_rng: {role: source_reset, identity: episode_number, namespace: 0, index: 0}
    episode_id: {role: source_reset, identity: episode_number, namespace: 1, index: 0}
    source_impulse_rng: {role: source_impulse, identity: episode_number_times_max_episode_steps_plus_episode_step, namespace: 0, index: 0}
    source_action_rng: {role: source_action, identity: episode_number_times_max_episode_steps_plus_episode_step, namespace: 0, index: 0}
    admission_crn_id: {role: admission, identity: proposal_index, namespace: 0, index: replica_index}
    admission_rollout_seed: {role: admission, identity: proposal_index, namespace: 1, index: replica_index}
    admission_perturbation_seed: {role: admission, identity: proposal_index, namespace: 2, index: replica_index}
    admission_candidate_seed: {role: admission, identity: proposal_index, namespace: 3, index: 0}
    label_crn_id: {role: label, identity: proposal_index, namespace: 0, index: replica_index}
    label_rollout_seed: {role: label, identity: proposal_index, namespace: 1, index: replica_index}
    label_perturbation_seed: {role: label, identity: proposal_index, namespace: 2, index: replica_index}
    label_candidate_seed: {role: label, identity: proposal_index, namespace: 3, index: 0}
  domains:
    fit:
      admission: {literal_ascii_escaped: "qsafe_state_dependent_recovery_v4_stage_b_fit_admission\\0", sha256_prefix_low15: 15295}
      label: {literal_ascii_escaped: "qsafe_state_dependent_recovery_v4_stage_b_fit_label\\0", sha256_prefix_low15: 4157}
    probability_calibration:
      admission: {literal_ascii_escaped: "qsafe_state_dependent_recovery_v4_stage_b_probability_calibration_admission\\0", sha256_prefix_low15: 30411}
      label: {literal_ascii_escaped: "qsafe_state_dependent_recovery_v4_stage_b_probability_calibration_label\\0", sha256_prefix_low15: 24324}
    uncertainty_calibration:
      admission: {literal_ascii_escaped: "qsafe_state_dependent_recovery_v4_stage_b_uncertainty_calibration_admission\\0", sha256_prefix_low15: 32283}
      label: {literal_ascii_escaped: "qsafe_state_dependent_recovery_v4_stage_b_uncertainty_calibration_label\\0", sha256_prefix_low15: 4139}
    selector_calibration:
      admission: {literal_ascii_escaped: "qsafe_state_dependent_recovery_v4_stage_b_selector_calibration_admission\\0", sha256_prefix_low15: 32430}
      label: {literal_ascii_escaped: "qsafe_state_dependent_recovery_v4_stage_b_selector_calibration_label\\0", sha256_prefix_low15: 22370}
    model_test:
      admission: {literal_ascii_escaped: "qsafe_state_dependent_recovery_v4_stage_b_model_test_admission\\0", sha256_prefix_low15: 4704}
      label: {literal_ascii_escaped: "qsafe_state_dependent_recovery_v4_stage_b_model_test_label\\0", sha256_prefix_low15: 1103}
  all_ten_domain_prefixes_pairwise_distinct: true

split_and_normalization:
  pairwise_role_pairs_exact: 10
  collision_dimensions: [policy_training_seed, actor_checkpoint_sha256, actor_state_dict_sha256, policy_fingerprint_sha256, checkpoint_fingerprint_sha256, state_fingerprint_sha256, trajectory_fingerprint_sha256, crn_id, rollout_seed, perturbation_seed, candidate_seed]
