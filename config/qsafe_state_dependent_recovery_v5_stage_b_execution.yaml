  crash_after_consumed_marker: permanently_consumed_stage_b_failure_no_rerun
  rerun_or_replacement_model_test: forbidden

conformal:
  stable_row_order: actor_training_seed_source_seed_trajectory_fingerprint_group_id_candidate_index
  empirical_risk: equal_replica_mean_per_complete_group_candidate
  risk_score: empirical_risk_k_minus_temperature_scaled_ensemble_mean_risk_k
  benefit_score: predicted_nominal_minus_candidate_benefit_minus_empirical_nominal_minus_candidate_benefit
  nominal_score: predicted_nominal_risk_minus_empirical_nominal_risk
  nonnominal_candidate_indices: [1, 2, 3, 4, 5, 6, 7, 8]
  risk_family_alpha: 0.05
  benefit_family_alpha: 0.05
  per_option_alpha: 0.00625
  nominal_alpha: 0.05
  rank: one_based_min_n_ceil_n_plus_1_times_1_minus_alpha
  ties: stable_sorted_value_at_exact_rank
  offsets_remain_signed: true
  risk_clip: [0.0, 1.0]
  benefit_clip: [-1.0, 1.0]

selector_search_bootstrap:
  grid_iteration_order: nominal_threshold_outer_then_benefit_threshold_then_max_risk_threshold_inner
  grid_points_exact: 100
  statistic_weighting: equal_actor_then_equal_source_within_actor_then_equal_complete_group
  resampling:
    outer: sample_actor_training_seeds_with_replacement_same_count
    middle: retain_every_registered_source_stratum_for_each_sampled_actor
    inner: sample_complete_trajectory_groups_with_replacement_within_source_same_count
  replicates: 50000
  rng: numpy_PCG64
  seed: 20260811
  simultaneous_root: max_over_grid_of_observed_reduction_minus_bootstrap_reduction
  simultaneous_critical_quantile: 0.95
  quantile_method: linear
  lower_bound: observed_reduction_minus_simultaneous_critical_value
  feasibility: point_reduction_gte_0.03_and_simultaneous_lcb_gt_0_and_intervention_rate_lte_0.35
  selection_order: largest_simultaneous_lcb_then_lower_intervention_rate_then_machine_grid_order

placebo:
  fit_role: selector_calibration
  fit_after_selector_frozen: true
  outcome_columns_read: forbidden
  nominal_risk_value: calibrated_conformal_nominal_risk_lcb
  nominal_risk_bin_edges: numpy_linear_quantiles_0_to_1_in_0.1_steps_with_interior_searchsorted_right
  repeated_edge_bins: permitted_empty
  first_action_distance_value: requested_action_rms_delta_from_nominal
  distance_edges: numpy_linear_quantiles_over_all_support_eligible_nonnominal_options_at_0_0.25_0.5_0.75_1
  distance_bin_assignment: interior_searchsorted_right_clipped_0_to_3
  duration_order: [10, 25, 50]
  table_cell_order: risk_bin_then_duration_then_distance_bin
  target: frozen_qsafe_selector_decision_distribution
  objective_order: [absolute_intervention_rate_error, duration_histogram_total_variation, first_action_distance_ks]
  ties: lexicographic_table_order
  runtime_cell_draw: preassigned_counter_based_numpy_PCG64
  rng_domain_literal_ascii_escaped: "qsafe_state_dependent_recovery_v4_placebo\\0"
  rng_seed_payload: domain_then_source_seed_u64le_then_group_fingerprint_raw32_then_draw_index_u64le
  rng_seed_integer: sha256_payload_as_uint256_little_endian
  option_draw: uniform_over_current_state_eligible_options_in_sampled_duration_distance_cell
  empty_cell: deterministic_abstain_without_fallback
  max_intervention_rate_mismatch: 0.02
  max_duration_total_variation: 0.05
  max_action_distance_ks: 0.10

model_test_statistics:
  stable_weighting: equal_actor_then_equal_source_within_actor_then_equal_complete_group
  bootstrap_resampling: same_as_selector_search_bootstrap
  replicates: 50000
  rng: numpy_PCG64
  seed: 20260812
  quantile_method: linear
  pair_accuracy_lcb: percentile_0.025_two_sided_95_lower_endpoint
  top1_reduction_lcb: percentile_0.05_one_sided_95_lower_bound
  frozen_selector_reduction_lcb: percentile_0.05_one_sided_95_lower_bound
  strong_pair_gap_inclusive: 0.25
  empirical_pair_ties: excluded
  predicted_pair_ties: half_credit
  ece_bins: 10_stable_equal_mass_bins
  ece_weighting: equal_group_mass_divided_equally_across_all_K9_candidates
  oracle_gap_capture_zero_or_negative_denominator: fail
  directional_subgroups: [three_checkpoint_ages, four_actor_training_seeds, twelve_source_seeds]
  outcome_driven_threshold_or_selector_change: forbidden
  pass_authorizes: stage_C_only
  objective1_pass_after_stage_b: false
  phase2_authorized_after_stage_b: false
