# Shared Python runtime/training defaults.
# The C++ controller uses runtime/control/go2/go2.yaml for low-level motion.

domain_id: 1
interface: lo
control_hz: 500
ipc_socket: /tmp/go2_policy.sock
state_socket: /tmp/go2_policy.sock.state
runtime_action_shm: go2_runtime_action
runtime_state_shm: go2_runtime_state
sport_velocity_world_frame: true
sport_state_max_age_ms: 250

# Joint order: FR, FL, RR, RL x hip, thigh, calf.
joint_min: [-1.05, -1.57, -2.72, -1.05, -1.57, -2.72, -1.05, -0.52, -2.72, -1.05, -0.52, -2.72]
joint_max: [1.05, 3.49, -0.84, 1.05, 3.49, -0.84, 1.05, 4.54, -0.84, 1.05, 4.54, -0.84]
init_qpos: [0.05, 0.7, -1.4, 0.05, 0.7, -1.4, 0.05, 0.7, -1.4, 0.05, 0.7, -1.4]
action_offset: [0.2, 0.4, 0.4, 0.2, 0.4, 0.4, 0.2, 0.4, 0.4, 0.2, 0.4, 0.4]

success_orientation_rad: 0.523599
fallen_risk_rad: 0.099066
fallen_orientation_rad: 1.047198
imu:
  upright_acc_z: 3.0
  upside_down_acc_z: 0.0
  upright_up_cos: 0.5
  upside_down_up_cos: -0.7

joint_tolerance: 0.20
move_speed: 0.5
reward_profile: upstream
action_filter_highcut: 4.0

train:
  experiment_name: default
  seed: 42
  control_frequency: 20.0
  max_episode_steps: 400
  reset_grace_steps: 20
  reset_hold_steps: 220
  reset_joint_tolerance: 0.30
  recovery_stable_steps: 10
  standup_timeout_steps: 200
  abort_on_unstable_reset: true
  max_joint_delta: null
  use_action_filter: false
  explore_action_scale: 0.2
  max_steps: 1000000
  start_training: 1000
  batch_size: 256
  utd_ratio: 20
  buffer_size: 1000000
  terminal_replay_repeats: 4
  log_interval: 100
  metrics_interval: 1
  rolling_summary_window: 1000
  save_dir: saved/checkpoints
  checkpoint_interval: 1000
  use_tqdm: true
  save_checkpoints: true
  resume_checkpoint: false
  benchmark_only: false
  benchmark_steps: 200
  wandb: true
  wandb_project: go2_walk
  wandb_run_name: null
  agent: droq

  flashsac:
    device_type: cuda
    buffer_device_type: cuda
    normalize_reward: false
    normalized_G_max: 10.0
    asymmetric_observation: false
    buffer_min_length: 1000
    learning_rate_init: 1.0e-6
    learning_rate_peak: 3.0e-4
    learning_rate_end: 1.0e-6
    learning_rate_warmup_step: 1000
    learning_rate_decay_step: 1000000
    actor_num_blocks: 2
    actor_hidden_dim: 256
    actor_bc_alpha: 0.0
    actor_noise_zeta_mu: 2.0
    actor_noise_zeta_max: 10
    actor_update_period: 1
    critic_num_blocks: 2
    critic_hidden_dim: 256
    critic_num_bins: 101
    critic_min_v: -100.0
    critic_max_v: 1000.0
    temp_initial_value: 0.1
    temp_target_sigma: 0.2
    n_step: 1
    use_compile: false
    compile_mode: reduce-overhead
    use_amp: false

  droq:
    device_type: cuda
    buffer_device_type: cuda
    buffer_min_length: 1000
    actor_lr: 3.0e-4
    critic_lr: 3.0e-4
    temp_lr: 3.0e-4
    hidden_dims: [256, 256]
    gamma: 0.99
    n_step: 1
    critic_target_update_tau: 0.005
    num_qs: 5
    num_min_qs: 2
    critic_dropout_rate: 0.01
    critic_layer_norm: true
    sampled_backup: true
    target_entropy: null
    temp_initial_value: 0.1
    actor_q_reduction: min
    target_q_min: -100.0
    target_q_max: 1000.0
    asymmetric_observation: false
    actor_update_period: 1
    use_compile: false
    compile_mode: reduce-overhead
    use_amp: false

  livesac:
    device_type: cuda
    buffer_device_type: cpu
    buffer_min_length: 1000
    actor_lr: 3.0e-4
    critic_lr: 3.0e-4
    temp_lr: 3.0e-4
    actor_hidden_dims: [256, 256]
    critic_hidden_dim: 256
    critic_expansion: 2
    critic_num_blocks: 1
    critic_num_qs: 2
    critic_num_bins: 101
    critic_min_v: -5.0
    critic_max_v: 5.0
    critic_target_update_tau: 0.005
    normalize_reward: true
    normalized_G_max: 5.0
    gamma: 0.99
    n_step: 1
    target_entropy: null
    temp_initial_value: 0.1
    asymmetric_observation: false
    actor_update_interval: 1
    actor_update_unit: policy_step
    use_compile: false
    compile_mode: reduce-overhead
    use_amp: false
    load_optimizer: true
    load_reward_normalizer: false

  # DroQ-compatible safety agent. The default logging mode computes only the
  # nominal-action risk and never modifies the action. Set mode to masking
  # only after validating the transferred Q_safe.
  safe_droq:
    safety_mode: logging
    safety_hidden_dims: [256, 256]
    safety_lr: 3.0e-4
    safety_gamma: 0.99
    safety_target_update_tau: 0.005
    safety_buffer_max_length: 100000
    safety_buffer_min_length: 1000
    safety_batch_size: 256
    safety_failure_horizon: 32
    # With Go2 utd_ratio=5 this is one Q_safe update per policy step.
    safety_update_period: 5
    safety_future_loss_weight: 0.5
    safety_num_candidates: 32
    safety_epsilon: 0.20
    safety_activation_step: 1000
    safety_pretrained_path: null
    freeze_safety_critic: false
