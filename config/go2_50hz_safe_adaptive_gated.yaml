# Adaptive Q_safe pilot: target-policy warmup, progressive masking and
# reward-performance-preserving local candidate selection.
reward_profile: upstream
move_speed: 0.30

train:
  experiment_name: go2_50hz_030_adaptive_gated
  control_frequency: 50.0
  max_steps: 15000
  start_training: 1000
  agent: safe_droq
  explore_action_scale: 0.5
  utd_ratio: 5
  save_dir: saved/experiments/go2_50hz_safe_adaptive_gated
  checkpoint_interval: 5000
  metrics_interval: 10
  wandb_run_name: go2_50hz_safe_adaptive_gated

  safe_droq:
    safety_mode: masking
    safety_update_period: 5
    safety_num_candidates: 32
    safety_epsilon: 0.20
    # First learn from target-policy data without intervening, then expand the
    # permitted local action neighborhood over the following 2k steps.
    safety_activation_step: 2000
    safety_masking_ramp_steps: 2000
    safety_min_risk_improvement: 0.05
    safety_max_action_rms: 0.35
    # Reward Q is the available performance/tracking proxy. Reject candidates
    # whose conservative reward value is materially below the nominal action.
    safety_reward_q_margin: 10.0
