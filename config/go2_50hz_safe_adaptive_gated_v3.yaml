# Adaptive Q_safe v3: keep candidate actions local and reduce auxiliary-update
# latency so the safety learner does not change the effective command rate.
reward_profile: upstream
move_speed: 0.30

train:
  experiment_name: go2_50hz_030_adaptive_gated_v3
  control_frequency: 50.0
  max_steps: 15000
  start_training: 1000
  agent: safe_droq
  explore_action_scale: 0.5
  utd_ratio: 5
  save_dir: saved/experiments/go2_50hz_safe_adaptive_gated_v3
  checkpoint_interval: 5000
  metrics_interval: 10
  wandb_run_name: go2_50hz_safe_adaptive_gated_v3

  safe_droq:
    safety_mode: masking
    # With UTD=5 this performs one Q_safe update per five policy steps.
    safety_update_period: 25
    safety_num_candidates: 32
    safety_epsilon: 0.20
    safety_activation_step: 3000
    safety_masking_ramp_steps: 2000
    safety_min_risk_improvement: 0.02
    safety_max_action_rms: 0.15
    safety_contract_candidates: true
    safety_reward_q_margin: 2.0
