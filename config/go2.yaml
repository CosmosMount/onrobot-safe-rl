# Default online Go2 training profile. Inherits config/common.yaml.
reward_profile: locomotion_straight
# Conservative straight-walking command.  The old 0.5 m/s target combined
# with a weak yaw penalty allowed the policy to earn reward while circling.
move_speed: 0.3
reward_command_vx: 0.3
reward_tracking_ang_vel_weight: 4.0
reward_lateral_velocity_weight: 0.5
reward_roll_pitch_rate_weight: 0.4
train:
  agent: flashsac
  control_frequency: 20.0
  explore_action_scale: 0.5
  async_collection: true
  max_steps: 15000
  utd_ratio: 1
  save_dir: saved/checkpoints_46d
