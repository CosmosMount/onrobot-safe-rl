schema_version: qsafe.natural_ppo_falls.v2
protocol_name: objective1_natural_ppo_direct_qsafe_supervision
created_at: "2026-08-11T19:15:00+08:00"
claim_eligible: false

purpose:
  ppo_role: direct_qsafe_training_and_state_coverage
  ppo_transition_as_qsafe_label:
    state_risk: allowed
    executed_action_risk_under_ppo_continuation: diagnostic_only
    counterfactual_recovery_action_risk: forbidden
  recovery_controller: original_go2_fixed_joint_target_sequence
  learned_recovery_policy: forbidden
  model_test_state_source: sac_only
  objective2_before_objective1_authorization: forbidden

supersedes:
  protocol: objective1_state_dependent_recovery_qsafe_v5_stage_b_reduced7_amendment
  scope: fixed_perturbation_source_collection_only
  actor_bank_reusable: true
  aborted_attempt_path: saved/qsafe_development/state_dependent_recovery_v5/stage-b/aborted-fixed-perturbation-db761ac
  aborted_generator_commit: db761ac2791d87e0195615fd197923077698ba93
  aborted_source_attempts: 10
  completed_sources: 0
  reason: fixed_perturbation_distribution_rejected

environment:
  task: Unitree-Go2-Flat
  ppo_command:
    distribution: constant
    vx_mps: 0.30
    vy_mps: 0.0
    yaw_rate_rps: 0.0
    standing_environment_fraction: 0.0
    realized_command_recorded_per_frame: true
  target_sac_objective1_command:
    vx_mps: 0.30
    vy_mps: 0.0
    yaw_rate_rps: 0.0
  policy_frequency_hz: 50
  low_level_frequency_hz: 500
  external_force:
    xfrc_applied_nonzero: forbidden
    impulse: forbidden
    velocity_injection: forbidden
    push_event: disabled
  domain_randomization:
    source: upstream_go2_flat_defaults
    enabled: [foot_friction, base_com, encoder_bias, reset_base_pose]
    disabled_or_zero_range: [body_mass, actuator_parameters, initial_joint_offset]
    every_realized_value_recorded: true

backend:
  preferred: unitree_mjlab_mujoco_warp_rsl_rl
  fallback: mjx_jax_mature_ppo
  native_subprocess_512_or_1024: forbidden
  parity_states: 100
  parity_policy_steps_per_state: 100
  capacity_ladder: [256, 512, 1024, 2048]
  capacity_warm_run_seconds: 300
  selected_capacity_stability_seconds: 1800
  max_peak_vram_mib: 20480
  min_upgrade_throughput_gain_fraction: 0.15
  target_alignment_required_before_capacity_selection: true
  target_alignment:
    policy_frequency_hz: 50
    physics_timestep_s: 0.002
    physics_substeps_per_policy_step: 10
    episode_policy_steps: 500
    initial_base_height_m: 0.445
    initial_joint_position: [0.05, 0.70, -1.40]
    normalized_action_scale: [0.20, 0.40, 0.40]
    kp: 60.0
    kd: 5.0
    passive_joint_damping: 0.1
    joint_frictionloss: 0.2
    integrator: euler
    cone: elliptic
    solver: newton
    iterations: 100
    impratio: 100.0
    exact_target_fall_terminal: true

ppo:
  implementation: rsl_rl_clipped_ppo
  training_from_zero: true
  fixed_policy_env_steps: 30000000
  checkpoint_steps: [0, 1000000, 2000000, 5000000, 10000000, 20000000, 30000000]
  checkpoint_or_seed_filter_by_return_or_falls: forbidden
  optional_stopping_or_top_up: forbidden
  upstream_unaligned_pilot_or_capacity_as_production_evidence: forbidden

fall_collection:
  first_terminal_fall_per_episode_only: true
  reset_in_same_vector_step: true
  post_terminal_fallen_stepping: forbidden
  ring_policy_steps: 65
  prefall_offsets: [1, 2, 4, 8, 16, 32, 64]
  short_episode_policy: retain_with_availability_mask
  store_every_independent_fall: true
  outcome_severity_or_type_filter: forbidden
  snapshot_fields:
    - integration_state
    - qpos
    - qvel
    - act
    - ctrl
    - observation_history_5x46
    - previous_action_requested
    - previous_action_executed
    - previous_action_q_target
    - action_filter_state
    - ppo_training_step
    - environment_identity
    - episode_identity
    - policy_step_identity
    - realized_velocity_command
    - randomization_values
    - rng_identity
  integration_state_components:
    - time
    - qpos
    - qvel
    - act
    - qacc_warmstart
  absent_application_state:
    action_filter_state: none

normal_collection:
  selection: fixed_hash_before_branch_outcomes
  minimum_distance_from_terminal_steps: 96
  match_strata: [ppo_checkpoint_age, randomization_stratum]
  target_ratio_per_available_prefall_state: 1

direct_ppo_supervision:
  risk_horizon_policy_steps: 96
  positive_examples: prefall_states_at_registered_offsets
  positive_label: fall_within_96_steps
  negative_examples: matched_normal_states
  negative_label: survived_next_96_steps
  supervised_heads: [state_risk]
  continuation_semantics: ppo_on_policy
  split_cluster: [ppo_seed, environment_identity, episode_identity]
  split_individual_snapshots_across_roles: forbidden
  use_for_counterfactual_recovery_action_head: forbidden

storage:
  format: compressed_npz_shards
  events_per_shard: 1024
  atomic_publication: true
  manifest_last: true
  duplicate_snapshot_identity: fail_closed
  large_artifacts_in_git: forbidden

native_import:
  backend: train.mujoco_snapshot_env.MujocoSnapshotEnv
  settle_after_import: forbidden
  call_mj_forward_only: true
  reconstruct_application_state: true
  parity_failure_action: retain_in_raw_archive_but_exclude_from_qsafe_dataset
  parity_rejection_top_up: forbidden

qsafe_runtime:
  critic_role: state_risk_trigger
  critic_input: corrected_deployable_observation_history_5x46
  unsafe_decision: calibrated_risk_and_uncertainty_gate
  safe_action: execute_target_sac_action
  unsafe_action: execute_next_original_recovery_sequence_q_target
  alternative_action_selection: deterministic_sequence_stage_and_tick
  learned_candidate_selector: false
  recovery:
    implementation: runtime/control/go2/motions/src/recovery.cpp
    configuration: runtime/control/go2/go2.yaml
    learned_policy_used: false
    control_frequency_hz: 500
    stages: [fold, above, swing_down, push]
    gains: {kp: 100.0, kd: 8.0}
    complete_sequence_is_persistent: true
    original_controller_acceptance:
      fallen_roll_or_pitch_rad: 0.523599
      or_upside_down: true
    fall_predicate_remains_active_during_recovery: true
    recovery_threshold_crossing_exemption: forbidden

qsafe_validation:
  continuation_policy: target_sac
  horizon_policy_steps: 96
  paired_arms: [nominal_sac, qsafe_fixed_recovery, matched_random_fixed_recovery]
  common_random_numbers_across_arms: true
  direct_fit_source: matched_ppo_prefall_and_normal_states
  calibration_source: sac_only
  model_test_source: sac_only
  development_group_ladder: [1000, 3000, 10000]
  recovery_outcomes_train_qsafe: false
  fixed_recovery_preflight:
    standing_negative_control_required: true
    natural_prefall_same_state_headroom_required: true
    any_recovery_threshold_crossing_counts_as_fall: true
    failure_action: do_not_train_or_deploy_trigger_with_failed_recovery

reporting:
  periodic_user_updates: disabled
  external_watcher_or_automation: forbidden
  report_only_at_phase_or_terminal_result: true
