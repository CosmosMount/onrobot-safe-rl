schema_version: ppo_sqrl_go2.config.v1
environment:
  task: Unitree-Go2-Flat
  policy_frequency_hz: 50
  physics_frequency_hz: 500
  max_episode_steps: 500
  history_frames: 5
  corrected_observation_dim: 46
  ppo_observation_dim: 47
  action_dim: 12
  normalized_action_projection: clamp_to_minus1_plus1
  external_push: false
ppo:
  rollout_steps: 125
  hidden_dims: [512, 256, 128]
  epochs: 5
  mini_batches: 4
  learning_rate: 0.001
  gamma: 0.99
  lambda: 0.95
  entropy_coefficient: 0.01
  value_coefficient: 1.0
  clip: 0.2
  max_gradient_norm: 1.0
  desired_kl: 0.01
qsafe:
  hidden_dims: [256, 256]
  gamma: 0.70
  epsilon: 0.10
  learning_rate: 0.0003
  target_tau: 0.005
  mask_candidates: 100
  recent_trajectories: 10
  batch_size: 256
target_dual:
  initial_value: 0.0
  learning_rate: 0.0003
